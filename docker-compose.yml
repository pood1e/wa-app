services:
  wa-app:
    image: ghcr.io/pood1e/wa-app/wa-app-service:${WA_APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      WA_SERVICE_TOKEN: ${WA_SERVICE_TOKEN:?Set WA_SERVICE_TOKEN}
      WA_APP_STORE: ${WA_APP_STORE:?Set WA_APP_STORE to postgres or sqlite}
      WA_APP_PG_DSN: ${WA_APP_PG_DSN:-}
      WA_APP_SQLITE_FILE: ${WA_APP_SQLITE_FILE:-/var/lib/wa-app/wa-app.sqlite3}
      WA_APP_EPHEMERAL_STORE: ${WA_APP_EPHEMERAL_STORE:-memory}
      WA_APP_VALKEY_URL: ${WA_APP_VALKEY_URL:-}
      WA_ACCOUNT_ADD_TARGET: wa-account-add:50092
      WA_APP_AUTH_PASSWORD: ${WA_APP_AUTH_PASSWORD:-}
      WA_COMMON_PROXY: ${WA_COMMON_PROXY:-}
    ports:
      - "127.0.0.1:50091:50091"
      - "127.0.0.1:8080:8080"
    volumes:
      - wa-app-data:/var/lib/wa-app
    restart: unless-stopped

  wa-account-add:
    image: ghcr.io/pood1e/wa-app/wa-account-add-service:${WA_ACCOUNT_ADD_IMAGE_TAG:-latest}
    build:
      context: .
      target: account-add
    environment:
      WA_SERVICE_TOKEN: ${WA_SERVICE_TOKEN:?Set WA_SERVICE_TOKEN}
      WA_ACCOUNT_RUNTIME_TARGET: wa-app:50091
      WA_COMMON_PROXY: ${WA_COMMON_PROXY:-}
      WA_ACCOUNT_ADD_IOS_SIGNER_TARGET: ${WA_ACCOUNT_ADD_IOS_SIGNER_TARGET:-}
      WA_ACCOUNT_ADD_ANDROID_SIGNER_TARGET: ${WA_ACCOUNT_ADD_ANDROID_SIGNER_TARGET:-}
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2-alpine
    profiles: ["valkey"]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: wa_app
      POSTGRES_DB: wa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_app -d wa_app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  wa-app-data:
    name: wa-app-data
  postgres-data:
