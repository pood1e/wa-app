[project]
name = "wa-android-attestation"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "frida==17.24.2",
  "frida-tools==14.11.0",
  "grpcio==1.84.0",
  "grpcio-health-checking==1.84.0",
  "protobuf==7.36.2",
]

[project.scripts]
wa-android-attestation = "wa_android_attestation.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_android_attestation", "generated/byte"]
artifacts = ["generated/**/*.py", "generated/**/*.pyi"]

[dependency-groups]
dev = ["grpcio-tools==1.84.0", "pytest>=9,<10", "ruff>=0.15"]

[tool.pytest.ini_options]
pythonpath = ["src", "generated"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
