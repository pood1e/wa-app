name: Build WA services

on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        default: all
        options: [all, runtime, account-add]
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  select:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - id: select
        env:
          REQUESTED_SERVICE: ${{ inputs.service || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          services = [
              {'target': 'runtime', 'image': 'wa-app-service'},
              {'target': 'account-add', 'image': 'wa-account-add-service'},
          ]
          requested = os.environ['REQUESTED_SERVICE']
          selected = [s for s in services if requested in ('all', s['target'])]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('services=' + json.dumps(selected) + '\n')
          PY

  build:
    needs: [select, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.image }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.service.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.service.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.target }}
