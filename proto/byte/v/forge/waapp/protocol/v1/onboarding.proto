syntax = "proto3";

package byte.v.forge.waapp.protocol.v1;

import "byte/v/forge/waapp/protocol/v1/account.proto";
import "byte/v/forge/waapp/protocol/v1/handshake.proto";

option go_package = "github.com/pood1e/wa-app/gen/go/byte/v/forge/waapp/protocol/v1;protocolv1";

// Version-specific APK material bundled with the protocol implementation.
message AndroidBuildMaterial {
  string app_version = 1;
  uint32 version_code = 2;
  bytes token_hmac_key = 3;
  bytes signing_certificate = 4;
  bytes classes_dex_md5 = 5;
  bytes server_public_key = 6;
  reserved 7;
  bytes noise_root_public_key = 8;
  AndroidApplicationIntegrity application_integrity = 9;
  reserved 10, 11;
}

// Host-owned logical client parameters, independent of the signing device.
message AndroidClientParameters {
  ClientMetadata metadata = 1;
  string memory_gib = 2;
  AndroidRegistrationOptions options = 3;
  bytes requested_permissions_sha256 = 4;
  bytes native_library_names_sha256 = 5;
  bytes data_so_names_sha256 = 6;
}

message AndroidApplicationIntegrity {
  uint64 apk_size = 1;
  bytes apk_sha256 = 2;
  bytes apk_prefix_sha256 = 3;
  bytes primary_dex_sha256 = 4;
  bytes certificate_sha1 = 5;
  reserved 6, 7, 8;
}

message AndroidRegistrationOptions {
  optional bool clicked_education_link = 1;
  optional bool manage_call_permission = 2;
  optional bool call_log_permission = 3;
  bytes client_start_message = 4;
  optional bool adb_enabled = 5;
  bool enable_pq_registration = 6;
  HandshakePQMode handshake_pq_mode = 7;
  reserved 8;
}

// Version-specific protocol metadata. Build token material is sensitive.
message IOSRegistrationProfile {
  string app_version = 1;
  string user_agent = 2;
  string language = 3;
  string locale = 4;
  string build_token_secret = 5;
  string build_hash = 6;
  ClientMetadata client = 7;
  string recaptcha_site_key = 8;
}

// Private key material owned by an in-memory registration flow.
message RegistrationKeyMaterial {
  bytes noise_private_key = 1;
  bytes identity_private_key = 2;
  bytes signed_pre_key_private_key = 3;
  bytes signed_pre_key_signature = 4;
  uint32 registration_id = 5;
  uint32 signed_pre_key_id = 6;
}

// Sensitive response material retained only by the in-memory Android flow.
message AndroidVerificationContext {
  string login = 1;
  string auth_response = 2;
  string context = 3;
  string advertising_id = 4;
}

message PasswordEncryptionKey {
  string public_key = 1;
  uint32 key_id = 2;
}

// Observed upstream response fields; login and LID are sensitive.
message IOSRegistrationResponse {
  string status = 1;
  string reason = 2;
  string method = 3;
  string login = 4;
  string lid = 5;
  int32 length = 6;
  int32 sms_length = 7;
  optional int64 sms_wait = 8;
  optional int64 voice_wait = 9;
  optional int64 retry_after = 10;
  optional int64 wa_old_wait = 11;
  int32 wa_old_length = 12;
  optional int32 wa_old_eligible = 13;
  optional int64 email_otp_wait = 14;
  int32 email_otp_length = 15;
  optional int32 email_otp_eligible = 16;
  optional int64 guess_wait = 17;
  string next_method = 18;
  optional int64 recaptcha_wait = 19;
}

message IOSRecaptchaPayload {
  string token = 1;
  int32 token_length = 2;
  int32 token_age = 3;
}

enum RegistrationRequestKind {
  REGISTRATION_REQUEST_KIND_UNSPECIFIED = 0;
  REGISTRATION_REQUEST_KIND_EXIST = 1;
  REGISTRATION_REQUEST_KIND_CODE = 2;
  REGISTRATION_REQUEST_KIND_REGISTER = 3;
}

message WamsysScalarField {
  string field_name = 1;
  string value = 2;
}

message WamsysMapParam {
  string key = 1;
  bytes value = 2;
}

message WamsysByteField {
  string field_name = 1;
  bytes value = 2;
}

message WamsysCapture {
  repeated WamsysScalarField scalar_fields = 1;
  repeated WamsysMapParam map_params = 2;
  repeated WamsysByteField byte_fields = 3;
}
